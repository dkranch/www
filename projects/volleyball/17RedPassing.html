<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Passing Ratings Report</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --text:#1d2430; --muted:#6b7585; --accent:#2563eb; --grid:#e3e6eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12161c; --card:#1b212a; --text:#e6e9ee; --muted:#93a0b2; --accent:#60a5fa; --grid:#2a323d; }
  }
  body { margin:0; padding:16px; background:var(--bg); color:var(--text); font-family:system-ui,sans-serif; }
  h1 { margin:0 0 4px; font-size:1.5rem; }
  .sub { color:var(--muted); margin-bottom:16px; }
  .card { background:var(--card); border-radius:10px; padding:16px; box-shadow:0 1px 3px rgba(0,0,0,.12); }
  .team { margin-bottom:20px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:16px; }
  .card h2 { margin:0 0 2px; font-size:1.05rem; }
  .meta b { color:var(--text); font-size:1.05rem; }
  .meta { color:var(--muted); font-size:.85rem; margin-bottom:8px; }
  .chartbox { position:relative; height:220px; }
  .team .chartbox { height:300px; }
</style>
</head>
<body>
<h1>Passing Ratings Report</h1>
<div class="sub" id="sub"></div>
<div class="card team">
  <h2>Team overall</h2>
  <div class="meta">Attempt-weighted average per session (0–3 scale)</div>
  <div class="chartbox"><canvas id="team"></canvas></div>
</div>
<div class="grid" id="players"></div>
<script>
const DATA = {"sessions": ["2026-11-04 17:25", "2026-11-13 20:41", "2026-11-18 20:58", "2026-11-19 20:58", "2026-11-24 21:26"], "players": {"Montana": {"ratings": [1.6, 2.43, 1.86, 1.6, 2.0], "attempts": [5, 7, 7, 5, 10], "season_avg": 1.94}, "Lucia": {"ratings": [2.0, 1.75, 1.5, 1.83, 2.0], "attempts": [5, 8, 6, 6, 8], "season_avg": 1.82}, "Colette": {"ratings": [2.33, 1.3, 1.86, 2.6, 1.38], "attempts": [6, 10, 7, 5, 8], "season_avg": 1.78}, "Divon": {"ratings": [1.63, 1.13, 2.0, 1.75, 2.38], "attempts": [8, 8, 6, 4, 8], "season_avg": 1.77}, "Mya": {"ratings": [1.67, 1.5, 2.0, 1.25, null], "attempts": [6, 6, 2, 4, 0], "season_avg": 1.56}, "Zoe": {"ratings": [1.43, 1.86, 1.86, 0.8, null], "attempts": [7, 7, 7, 5, 0], "season_avg": 1.54}, "Lexi": {"ratings": [null, 1.0, 2.0, 1.75, 1.5], "attempts": [0, 9, 5, 4, 6], "season_avg": 1.46}, "Josie": {"ratings": [0.0, 1.14, 1.2, 1.6, 1.9], "attempts": [1, 7, 5, 5, 10], "season_avg": 1.46}, "Ava": {"ratings": [null, 1.67, 0.5, 0.5, 2.0], "attempts": [0, 3, 2, 2, 2], "season_avg": 1.22}, "Carsyn": {"ratings": [1.0, 1.2, 1.0, 2.0, null], "attempts": [4, 5, 7, 3, 0], "season_avg": 1.21}, "Rikki": {"ratings": [0.75, 1.25, 0.5, 2.0, 1.0], "attempts": [4, 8, 6, 5, 8], "season_avg": 1.1}, "Maddie": {"ratings": [0.4, 0.57, 1.17, 0.25, 1.63], "attempts": [5, 7, 6, 4, 8], "season_avg": 0.9}, "Player 13": {"ratings": [null, null, null, null, null], "attempts": [0, 0, 0, 0, 0], "season_avg": null}}, "team": {"ratings": [1.45, 1.38, 1.49, 1.56, 1.75], "attempts": [51, 85, 66, 52, 68]}};
const css = getComputedStyle(document.documentElement);
const color = n => css.getPropertyValue(n).trim();

function line(canvas, label, ratings, attempts) {
  new Chart(canvas, {
    type: 'line',
    data: { labels: DATA.sessions, datasets: [{
      label, data: ratings, borderColor: color('--accent'), backgroundColor: color('--accent'),
      tension: .2, pointRadius: 6, borderWidth: 4, spanGaps: true }] },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false },
        tooltip: { callbacks: { afterLabel: c => 'Attempts: ' + attempts[c.dataIndex] } } },
      scales: {
        y: { min: 0, max: 3, ticks: { stepSize: 1, color: color('--muted') }, grid: { color: color('--grid') } },
        x: { ticks: { color: color('--muted') }, grid: { color: color('--grid') } } }
    }
  });
}

line(document.getElementById('team'), 'Team', DATA.team.ratings, DATA.team.attempts);

const container = document.getElementById('players');
let rank = 0;
for (const [name, p] of Object.entries(DATA.players)) {
  rank++;
  const total = p.attempts.reduce((s, x) => s + x, 0);
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<h2>${rank}. ${name}</h2><div class="meta">Season average <b>${p.season_avg === null ? '–' : p.season_avg.toFixed(2)}</b> · ${total} attempts</div>
    <div class="chartbox"><canvas></canvas></div>`;
  container.appendChild(card);
  line(card.querySelector('canvas'), name, p.ratings, p.attempts);
}
document.getElementById('sub').textContent =
  `${Object.keys(DATA.players).length} players · ${DATA.sessions.length} sessions`;
</script>
</body>
</html>
